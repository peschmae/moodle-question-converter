[project]
name = "moodle-qc"
version = "0.1.0"
description = "Question converter: Markdown question sources to Moodle XML import files and back"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
moodle-qc = "moodle_qc.cli:run"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodle_qc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Question texts are German and use typographic dashes and quotes.
allowed-confusables = ["–", "−", "«", "»", "×"]

[tool.ruff.lint.per-file-ignores]
# Inline Moodle XML in tests is easier to read unwrapped.
"tests/**" = ["E501"]

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"
