name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --tag moodle-qc:ci .
      - name: Smoke test
        run: |
          docker run --rm moodle-qc:ci --version
          cp -r tests/fixtures/collections/reference /tmp/questions
          docker run --rm --user "$(id -u):$(id -g)" -v /tmp/questions:/questions moodle-qc:ci \
            generate . --output import.xml
          grep -q '<question type="kprime">' /tmp/questions/import.xml
      - name: Publish to GitHub's container registry
        if: github.event_name == 'push'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if [ "$REF_TYPE" = tag ]; then tags="${REF_NAME#v} latest"; else tags="main"; fi
          for tag in $tags; do
            docker tag moodle-qc:ci "$image:$tag"
            docker push "$image:$tag"
          done
